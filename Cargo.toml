[workspace]
resolver = "2"
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ByteLand Technology Limited"]
repository = "https://github.com/ByteLandTechnology/flow-music-mcp"
homepage = "https://github.com/ByteLandTechnology/flow-music-mcp"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
expect_used = "deny"
missing_docs_in_private_items = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[package]
name = "flow-music-mcp"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false
description = "Rust MCP server for Google Flow Music with a Chrome CDP browser engine"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
tokio-tungstenite = "0.26"
url = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
