# Continuous integration and release automation for flow-music-mcp.
#
# Builds standalone x86_64 and ARM64 binaries for macOS, Linux, and Windows,
# uploads GitHub Release assets, and publishes npm packages through OIDC.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dependency-audit:
    name: Audit dependencies
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny check
        run: cargo deny --locked --workspace check

  build:
    name: release (${{ matrix.target }})
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: flow-music-mcp-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: flow-music-mcp-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: flow-music-mcp-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: flow-music-mcp-linux-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: flow-music-mcp-windows-x86_64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: flow-music-mcp-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node.js build dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check repository rules
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build documentation
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

      - name: Build release executable
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --release --target ${{ matrix.target }} --locked --bin flow-music-mcp

      - name: Prepare executable artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/flow-music-mcp${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.artifact }}"

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Collect dependency licenses
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask collect-licenses > dist/THIRD_PARTY_LICENSES.txt

      - name: Upload dependency licenses
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: dist/THIRD_PARTY_LICENSES.txt
          overwrite: true
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [release-please, build, dependency-audit]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # npm trusted publishers use the GitHub OIDC token.
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(jq -r '."."' .release-please-manifest.json)" = "$RELEASE_VERSION"
          metadata="$(cargo metadata --no-deps --locked --format-version 1)"
          for package in flow-music-mcp xtask; do
            actual="$(jq -r --arg package "$package" \
              '.packages[] | select(.name == $package) | .version' <<< "$metadata")"
            test "$actual" = "$RELEASE_VERSION"
          done
          test "$(jq -r .version npm/cli/package.json)" = "$RELEASE_VERSION"

      - name: Download release executables
        uses: actions/download-artifact@v4
        with:
          pattern: flow-music-mcp-*
          path: dist
          merge-multiple: true

      - name: Download dependency licenses
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: dist

      - name: Upload release executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          assets=(dist/flow-music-mcp-*)
          test "${#assets[@]}" -eq 6
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" | sed 's@  dist/@  @' > dist/SHA256SUMS
          cp LICENSE dist/LICENSE
          gh release upload "$RELEASE_TAG" "${assets[@]}" dist/SHA256SUMS dist/LICENSE dist/THIRD_PARTY_LICENSES.txt --clobber

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm 11.5.1 or later.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm version for trusted publishing
        run: |
          if ! printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C; then
            npm install --global npm@latest
          fi

      - name: Build npm packages
        run: cargo xtask npm-pack --dist dist --out npm-dist

      - name: Publish npm packages
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # Publish platform packages before the main CLI package.
          # Skip any version already on npm so retries can resume safely.
          platforms=()
          for directory in npm-dist/*/; do
            [ "$directory" = npm-dist/cli/ ] || platforms+=("$directory")
          done
          test "${#platforms[@]}" -eq 6
          for directory in "${platforms[@]}" npm-dist/cli/; do
            name="$(jq -r .name "$directory/package.json")"
            if npm view --userconfig /dev/null "$name@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "$name@$RELEASE_VERSION is on npm already"
              continue
            fi
            npm publish "$directory" --access public
          done

      - name: Make release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=legacy --silent
